name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Client/package-lock.json
      
      - name: Restore .NET dependencies
        run: dotnet restore
      
      - name: Create NuGet package
        run: dotnet pack --no-restore --configuration Release --output ./artifacts

      - name: Verify client assets
        run: |
          unzip -Z1 artifacts/*.nupkg | grep -Fx "staticwebassets/App_Plugins/HideIt/hideit.js"
          unzip -Z1 artifacts/*.nupkg | grep -Fx "staticwebassets/App_Plugins/HideIt/umbraco-package.json"
